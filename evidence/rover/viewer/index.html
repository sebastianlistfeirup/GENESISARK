<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colony Rover</title>
<!--
  GENESIS ARK, D-065: the six-wheeled colony utility rover as a phone-friendly three.js viewer.
  Built from the image-to-3d-rebuild skill's viewer_template.html. The model is the Godot
  ProcBuilder rebuild (scripts/runtime/visual/colony_rover.gd) exported at rest as GLB
  (base64 .txt). When rover_baked.* are present (local only: paint baked from the owner's
  Meshy scan) the scan's paint is mixed in on UV2, otherwise the procedural look is used.
  Mirrors 1:1 (same constants): RoverTimeline (unload, point turn, pull-away dip, spring
  step), ColonyRover (rocker-bogie solve, wheel spin and steer, sprung body, antenna,
  crates, lamps) and ColonyRovers.throttle (jerk-limited, braking planned to the mark).
  The whole vehicle is one material; the class rides in vertex colour B (class / 16).
  Template patterns kept: base64 GLB, onBeforeCompile + customProgramCacheKey, bloom via
  EffectComposer with prewarm() against composer.readBuffer, NaN-safe camera fit (0x0 first
  layout), adaptive pixel ratio, lights never added/removed after start (no recompiles),
  all motion from performance.now() + rAF (fake-clock friendly), fixed 1/120 s sim steps.
-->
<style>
  :root { --bg: #11161a; --ink: #eef3f4; --muted: #9fb3b8; --accent: #f08a2c; --cyan: #4fe0ff; --panel: #141c20; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; left: 16px; right: 16px; top: 12px; pointer-events: none; }
  .hud h1 { margin: 0; font: 650 21px/1.2 system-ui, sans-serif; letter-spacing: .02em; }
  .hud p { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 42em; }
  .beat { position: fixed; left: 16px; top: 74px; font: 600 12px/1.5 ui-monospace, monospace; color: var(--cyan); pointer-events: none; opacity: .9; }
  .tray { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
          background: color-mix(in srgb, var(--panel) 90%, transparent); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { font: 600 14px system-ui; padding: 10px 14px; border-radius: 10px; border: 1px solid #ffffff22; background: #23302f; color: var(--ink); min-height: 44px; }
  button.primary { background: var(--accent); color: #1a0f05; border: 0; }
  button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  button:disabled { opacity: .45; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .hud p { display: none; } .beat { top: 46px; } button { padding: 9px 11px; font-size: 13px; } }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div class="hud"><h1>Colony rover</h1><p>Genesis Ark · six-wheeled utility rover. Tap the rover (or Drive / Brake): it pulls away with a little rock, rides the bumps on its rocker-bogie, brakes into a stop; Unload tips the bed, Spin round turns it on the spot.</p></div>
<div class="beat" id="beat"></div>
<div id="loader">Loading…</div>
<div class="tray">
  <button id="drive" class="primary" type="button">Drive</button>
  <button id="unload" type="button">Unload</button>
  <button id="turn" type="button">Spin round</button>
  <button id="night" type="button" aria-pressed="false">Night</button>
  <button id="dust" type="button" aria-pressed="false">Desert</button>
  <button id="reduced" type="button" aria-pressed="false">Reduced motion</button>
  <button id="paint" type="button" aria-pressed="true" hidden>Scan paint</button>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = (id) => document.getElementById(id);
const isPhone = matchMedia("(max-width: 700px)").matches;
const TAU = Math.PI * 2;

// ================= RoverTimeline (scripts/runtime/visual/rover_timeline.gd)
const TL = { U_GATE_A: 250, U_GATE_B: 700, U_LIFT_A: 450, U_LIFT_B: 1800, U_SLIDE_A: 1000, U_DROP_A: 2900, U_SEAT: 3900, U_BACK_A: 3980,
  U_GATE_C: 4100, U_LATCH: 4500, U_END: 5200, BED_MAX: 0.40, GATE_MAX: 1.62, CRATE_STAGGER: 120, CRATE_SLIDE: [0.16, 0.12, 0.2, 0.1],
  T_STEER_B: 550, T_YAW_A: 700, T_YAW_B: 3900, T_UNSTEER_A: 3950, T_UNSTEER_B: 4450, T_END: 4700, DEPART_MS: 380 };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const k = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const bump = (t, a, b) => (t < a || t > b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
const easeIO = (x) => x * x * (3 - 2 * x);
const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
const easeBack = (x, o) => { const c = 1.70158 * o / 0.1, u = x - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const lerp = (a, b, x) => a + (b - a) * x;

function unloadPose(t, red) {
  let bed = 0, gate = 0, jolt = 0, hop = 0;
  if (!red) bed -= 0.012 * bump(t, 0, 420);
  if (t >= TL.U_LIFT_A && t < TL.U_DROP_A) {
    const x = k(t, TL.U_LIFT_A, TL.U_LIFT_B);
    bed += TL.BED_MAX * (red ? easeIO(x) : easeBack(x, 0.03));
    if (!red) bed += 0.004 * Math.sin(t * 0.07) * bump(t, TL.U_LIFT_A, TL.U_LIFT_A + 500);
  } else if (t >= TL.U_DROP_A && t < TL.U_SEAT) {
    const x = k(t, TL.U_DROP_A, TL.U_SEAT);
    bed = TL.BED_MAX * (1 - (red ? easeIO(x) : Math.pow(x, 2.4)));
  } else if (t >= TL.U_SEAT && !red) {
    const u = t - TL.U_SEAT;
    bed = 0.012 * Math.exp(-u / 70) * Math.abs(Math.sin(Math.PI * u / 90));
    jolt = 0.025 * Math.exp(-u / 110) * Math.cos(TAU * u / 240) * k(u, 0, 30);
    hop = 0.015 * Math.exp(-u / 60) * Math.abs(Math.sin(Math.PI * u / 120));
  }
  if (t >= TL.U_GATE_A && t < TL.U_GATE_C) {
    const x = k(t, TL.U_GATE_A, TL.U_GATE_B);
    gate = TL.GATE_MAX * (red ? easeIO(x) : easeBack(x, 0.06));
    if (!red && t > TL.U_GATE_B) { const u = t - TL.U_GATE_B; gate += 0.05 * Math.exp(-u / 150) * Math.sin(TAU * u / 320); }
  } else if (t >= TL.U_GATE_C && t < TL.U_LATCH) {
    const x = k(t, TL.U_GATE_C, TL.U_LATCH);
    gate = TL.GATE_MAX * (1 - (red ? easeIO(x) : Math.pow(x, 2.8)));
  } else if (t >= TL.U_LATCH && !red) {
    const u = t - TL.U_LATCH;
    gate = 0.035 * Math.exp(-u / 60) * Math.abs(Math.sin(Math.PI * u / 55));
  }
  const crates = [];
  for (let i = 0; i < 4; i++) {
    const slide = TL.CRATE_SLIDE[i], a = TL.U_SLIDE_A + TL.CRATE_STAGGER * i;
    let off = 0;
    if (t >= a && t < TL.U_BACK_A + 100 * i) {
      const x = k(t, a, a + 450);
      off = slide * (red ? easeIO(x) : Math.pow(x, 2));
      if (!red && t > a + 450) { const u = t - a - 450; off -= slide * 0.12 * Math.exp(-u / 80) * Math.abs(Math.sin(Math.PI * u / 110)); }
    } else if (t >= TL.U_BACK_A + 100 * i) {
      const x = k(t, TL.U_BACK_A + 100 * i, TL.U_BACK_A + 100 * i + 380);
      off = slide * (1 - (red ? easeIO(x) : easeBack(x, 0.05)));
    }
    crates.push(off);
  }
  const beacon = t < TL.U_END - 300 ? (0.5 + 0.5 * Math.sin(t * TAU * 2.2 / 1000)) * k(t, 0, 120) : 0;
  return { bed, gate, crates, hop, jolt, beacon };
}
function turnPose(t, red) {
  let steer;
  if (t < TL.T_UNSTEER_A) { const x = k(t, 0, TL.T_STEER_B); steer = red ? easeIO(x) : easeBack(x, 0.06); }
  else { const x = k(t, TL.T_UNSTEER_A, TL.T_UNSTEER_B); steer = 1 - (red ? easeIO(x) : easeBack(x, 0.06)); }
  const x2 = k(t, TL.T_YAW_A, TL.T_YAW_B);
  let yaw = Math.PI * smoother(x2);
  const rate = Math.PI * 30 * x2 * x2 * (x2 * (x2 - 2) + 1) / ((TL.T_YAW_B - TL.T_YAW_A) / 1000);
  if (!red) {
    yaw -= 0.03 * bump(t, 420, 820);
    if (t > TL.T_YAW_B) { const u = t - TL.T_YAW_B; yaw += 0.018 * Math.exp(-u / 180) * Math.sin(TAU * u / 480); }
  }
  const beacon = (0.5 + 0.5 * Math.sin(t * TAU * 2.2 / 1000)) * (1 - k(t, TL.T_END - 300, TL.T_END));
  return { steer, yaw, rate, beacon };
}
const departDip = (t, red) => (red ? 0 : 0.009 * bump(t, 0, TL.DEPART_MS));
function springStep(s, target, hz, zeta, dt) {
  const w = TAU * hz;
  s.v += (-w * w * (s.x - target) - 2 * zeta * w * s.v) * dt;
  s.x += s.v * dt;
}

// ================= ColonyRover / ColonyRovers constants
const RV = { WHEEL_R: 0.445, TRACK: 1.045, WZ: [1.456, -0.37, -1.54], Z0: -0.37, PIVOT_X: 0.7, ROCKER_Y: 0.74, ROCKER_Z: 0.30,
  BOGIE_Y: 0.60, BOGIE_Z: -0.955, BODY_PIVOT: new THREE.Vector3(0, 0.95, -0.2), STEER_PIVOT_F: 1.0757, STEER_PIVOT_R: 0.8418 };
const DRV = { A_MAX: 1.3, A_BRAKE: 1.15, A_HARD: 3.2, JERK: 3.0, A_LAT: 0.8, CRUISE: 4.2 };
function throttle(v, a, target, stopD, hard, dt) {
  let aCmd = clamp((target - v) * 1.7, -(hard ? DRV.A_HARD : DRV.A_BRAKE * 1.4), DRV.A_MAX);
  if (Number.isFinite(stopD) && v > 0.05) {
    const need = v * v / (2 * Math.max(stopD - v * 0.06, 0.02));
    if (need > DRV.A_BRAKE * 0.85) aCmd = Math.min(aCmd, -Math.min(need, DRV.A_HARD));
  }
  a += clamp(aCmd - a, -DRV.JERK * dt * (hard ? 3 : 1.4), DRV.JERK * dt);
  v = Math.max(v + a * dt, 0);
  if (v <= 0 && a < 0) a = 0;
  return [a, v];
}

// ================= renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 1.6 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = { day: new THREE.Color("#9cc7d8"), night: new THREE.Color("#0b1424") };
scene.background = SKY.day.clone();
scene.fog = new THREE.Fog(SKY.day.clone(), 30, 110);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
camera.position.set(7, 4.6, 8);            // direction only; resize() sets the distance
controls.enableDamping = true;
controls.minDistance = 4; controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.47;
const hemi = new THREE.HemisphereLight("#d8ecff", "#55663f", 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight("#fff0d8", 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0006;
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
scene.add(sun, sun.target);

// ================= the stage: a looped dirt track with ruts and two bumps on a meadow
const TRACK_A = 17, TRACK_B = 9;
function groundH(x, z) {
  let h = 0.05 * Math.sin(x * 0.31) * Math.cos(z * 0.27) + 0.03 * Math.sin(x * 1.3 + z * 0.7);
  for (const [bx, bz, r, hh] of [[TRACK_A, 0, 1.6, 0.22], [-TRACK_A * 0.55, TRACK_B * 0.83, 1.3, 0.16], [0, -TRACK_B, 2.2, 0.12]]) {
    const d = Math.hypot(x - bx, z - bz); if (d < r) h += hh * 0.5 * (1 + Math.cos(Math.PI * d / r));
  }
  return h;
}
const GROUND_COL = { grass: new THREE.Color("#6f9a45"), sand: new THREE.Color("#c99b62") };
const ROAD_COL = { grass: new THREE.Color("#8f7a55"), sand: new THREE.Color("#9a7c55") };
const groundGeo = new THREE.PlaneGeometry(140, 140, 140, 140);
groundGeo.rotateX(-Math.PI / 2);
const roadMask = new Float32Array(groundGeo.attributes.position.count);
{
  const P = groundGeo.attributes.position;
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), z = P.getZ(i);
    P.setY(i, groundH(x, z));
    const e = Math.abs(Math.hypot(x / TRACK_A, z / TRACK_B) - 1) * Math.min(TRACK_A, TRACK_B);
    roadMask[i] = 1 - k(e, 1.6, 3.0);
  }
  groundGeo.computeVertexNormals();
  groundGeo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(P.count * 3), 3));
}
function paintGround(desert) {
  const C = groundGeo.attributes.color, g = desert ? GROUND_COL.sand : GROUND_COL.grass, r = desert ? ROAD_COL.sand : ROAD_COL.grass, c = new THREE.Color();
  for (let i = 0; i < C.count; i++) { c.copy(g).lerp(r, roadMask[i]); C.setXYZ(i, c.r, c.g, c.b); }
  C.needsUpdate = true;
}
paintGround(false);
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
ground.receiveShadow = true; scene.add(ground);
{ // crates and rocks for scale
  const rm = new THREE.MeshStandardMaterial({ color: "#7d7466", roughness: 0.9, flatShading: true });
  [[-6, -2, 0.9], [7, 2.5, 1.2], [-3, 3.5, 0.6], [24, 6, 1.6], [-22, -7, 1.3]].forEach(([x, z, s]) => {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rm); r.position.set(x, groundH(x, z) + s * 0.35, z); r.rotation.set(x, z, 0.3);
    r.castShadow = r.receiveShadow = true; scene.add(r);
  });
}
// The track as an arc-length table (like ColonyRovers._route): points, tangents, curvature.
const ROUTE = (() => {
  const N = 2000, pts = [];
  for (let i = 0; i <= N; i++) { const a = TAU * i / N; pts.push(new THREE.Vector2(Math.sin(a) * TRACK_A, Math.cos(a) * TRACK_B)); }
  const cum = [0]; for (let i = 1; i <= N; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
  const len = cum[N], STEP = 0.5, n = Math.floor(len / STEP), P = [], Tn = [], K = [];
  let j = 1;
  for (let i = 0; i < n; i++) { const s = i * STEP; while (cum[j] < s) j++; const f = (s - cum[j - 1]) / (cum[j] - cum[j - 1]); P.push(pts[j - 1].clone().lerp(pts[j], f)); }
  for (let i = 0; i < n; i++) Tn.push(P[(i + 1) % n].clone().sub(P[(i - 1 + n) % n]).normalize());
  for (let i = 0; i < n; i++) { const t0 = Tn[(i - 2 + n) % n], t1 = Tn[(i + 2) % n]; const ang = Math.atan2(t0.x * t1.y - t0.y * t1.x, t0.dot(t1)); K.push(ang / (STEP * 4)); }
  return { P, T: Tn, K, len: n * STEP, n, STEP };
})();
function routeAt(s) {
  s = ((s % ROUTE.len) + ROUTE.len) % ROUTE.len;
  const f = s / ROUTE.STEP, i = Math.floor(f) % ROUTE.n, i2 = (i + 1) % ROUTE.n, fr = f - Math.floor(f);
  return { p: ROUTE.P[i].clone().lerp(ROUTE.P[i2], fr), t: ROUTE.T[i].clone().lerp(ROUTE.T[i2], fr).normalize(), k: lerp(ROUTE.K[i], ROUTE.K[i2], fr) };
}
// Ruts along each wheel track (ColonyRovers: two sines and the odd pebble).
const rut = (s, ph) => 0.012 * Math.sin(s * 2.3 + ph) + 0.007 * Math.sin(s * 5.9 + ph * 1.7) + 0.03 * Math.pow(Math.max(0, Math.sin(s * 0.61 + ph)), 24);

// ================= rover material: one material, palette by class (rover.gdshader)
const loadTex = (url, srgb) => new Promise((res) => new THREE.TextureLoader().load(url, (t) => {
  t.flipY = false; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = 8; res(t);
}, undefined, () => res(null)));
const U = { uBakeAlbedo: { value: null }, uBakeOrm: { value: null }, uPaint: { value: 0 }, uHead: { value: 0.25 }, uBrake: { value: 0.35 },
  uBeacon: { value: 0 }, uStrip: { value: 1 }, uDirt: { value: 0 }, uDirtCol: { value: new THREE.Color("#c9a878") } };
const PALETTE = `
  vec3 pal(int c){ if(c==1) return vec3(0.95,0.5,0.1); if(c==2) return vec3(0.19,0.2,0.22); if(c==3) return vec3(0.62,0.64,0.67);
    if(c==4) return vec3(0.1,0.1,0.11); if(c==5) return vec3(0.07,0.085,0.1); if(c==6) return vec3(0.12,0.32,0.36); if(c==7) return vec3(0.55,0.62,0.66);
    if(c==8) return vec3(0.35,0.05,0.04); if(c==9) return vec3(0.5,0.3,0.05); if(c==10) return vec3(0.82,0.83,0.82); if(c==11) return vec3(0.93,0.5,0.12);
    if(c==12) return vec3(0.19,0.2,0.22); return vec3(0.86,0.86,0.84); }
  float palRough(int c){ if(c==1) return 0.5; if(c==2||c==12) return 0.55; if(c==3) return 0.35; if(c==4) return 0.92; if(c==5) return 0.12; if(c>=6&&c<=9) return 0.25; if(c==10) return 0.65; if(c==11) return 0.6; return 0.55; }
  float palMetal(int c){ if(c==2) return 0.15; if(c==3) return 0.55; if(c==5) return 0.3; return 0.0; }
  float palPaint(int c){ if(c==0) return 0.85; if(c==1) return 0.6; if(c==2) return 0.5; if(c==3) return 0.3; if(c==10||c==11) return 0.4; if(c>=5&&c<=9) return 0.0; return 1.0; }
  float palWear(int c){ if(c==4) return 0.1; if(c>=5&&c<=9) return 0.0; return 0.35; }`;
function roverMat(name) {
  const m = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.55, metalness: 0.0 });
  m.name = name;
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nattribute vec4 color;\nvarying vec4 vMask; varying vec2 vBakeUv; varying vec2 vUv0; varying float vLy;\n#ifndef USE_UV1\nattribute vec2 uv1;\n#endif")
      .replace("#include <uv_vertex>", "#include <uv_vertex>\nvMask = color; vBakeUv = uv1; vUv0 = uv; vLy = position.y;");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", `#include <common>
        uniform sampler2D uBakeAlbedo, uBakeOrm; uniform float uPaint, uHead, uBrake, uBeacon, uStrip, uDirt; uniform vec3 uDirtCol;
        varying vec4 vMask; varying vec2 vBakeUv; varying vec2 vUv0; varying float vLy; ${PALETTE}
        float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }`)
      .replace("#include <map_fragment>", `#include <map_fragment>
        int cls = int(floor(vMask.b * 16.0 + 0.01));
        vec3 col = pal(cls);
        if (cls == 12) col = mix(col, vec3(0.92, 0.66, 0.12), step(0.5, fract((vUv0.x + vUv0.y) * 6.0)));
        col = pow(col, vec3(2.2));
        col *= 1.0 + (vMask.r - 0.5) * 0.12;
        float nz = hash12(floor(vUv0 * 150.0)); col *= 0.97 + 0.06 * nz;
        float wear = vMask.g * palWear(cls); col = mix(col, col * 1.18 + 0.04, wear);
        vec4 bA = texture2D(uBakeAlbedo, vBakeUv);
        float lc = dot(col, vec3(0.2126, 0.7152, 0.0722)), lb = dot(bA.rgb, vec3(0.2126, 0.7152, 0.0722));
        float agree = 1.0 - smoothstep(0.12, 0.3, abs(sqrt(lb) - sqrt(lc)));
        col = mix(col, bA.rgb, smoothstep(0.55, 0.95, bA.a) * uPaint * palPaint(cls) * agree);
        float dd = uDirt * (1.0 - smoothstep(0.35, 1.05, vLy)) * (0.7 + 0.3 * nz) * step(0.01, palPaint(cls));
        col = mix(col, uDirtCol, clamp(dd, 0.0, 0.75));
        diffuseColor.rgb = col;`)
      .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>

}
addEventListener("resize", () => resize(true));
st.s = ROUTE.len * 0.1;
stepSim(0); applyPose();
controls.target.copy(rover.position).add(new THREE.Vector3(0, 1.1, 0));
camera.position.copy(controls.target).add(DEFAULT_DIR);
resize();
prewarm();
setMode("drive");   // it starts out driving (reduced motion included: just without the bounce)

let last = -1;
const _tgt = new THREE.Vector3();
function frame(now) {
  if (fitPending && innerWidth > 0 && innerHeight > 0) resize(true);   // first real layout after a hidden (0x0) load
  adaptQuality(now);
  const dt = last < 0 ? 1 / 60 : Math.min(0.1, (now - last) / 1000);
  last = now;
  if (pending && st.v < 0.05 && st.turnT < 0 && st.unloadT < 0) {
    if (pending === "unload") st.unloadT = 0;
    else { st.turnT = 0; st.turnYaw0 = st.yaw; st.turnDir = Math.random() < 0.5 ? 1 : -1; }
    pending = null;
  }
  const c = stepSim(dt);
  stepRover(dt, c.curvature, c.yawRate);
  applyPose();
  stepDust(dt);
  beatText();
  // camera follows the rover softly (the user can still orbit)
  _tgt.copy(rover.position).add(new THREE.Vector3(0, 1.1, 0));
  const delta = _tgt.clone().sub(controls.target).multiplyScalar(clamp(dt * 3, 0, 1));
  controls.target.add(delta); camera.position.add(delta);
  sun.position.copy(rover.position).add(new THREE.Vector3(6, 12, 7)); sun.target.position.copy(rover.position);
  controls.update();
  composer.render();
}
window.__viewer = { THREE, scene, camera, controls, renderer, st, drive, unload, spinRound, unloadPose, turnPose, throttle, baked,
  programs: () => renderer.info.programs.length };
renderer.setAnimationLoop(frame);
</script>
